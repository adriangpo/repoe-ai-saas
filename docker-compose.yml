services:
  db:
    image: postgres:17-alpine
    container_name: repoe-ai-db
    environment:
      POSTGRES_DB: ${DB_NAME:-repoeai}
      POSTGRES_USER: ${DB_USER:-repoeai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - repoe-ai-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-repoeai} -d ${DB_NAME:-repoeai}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  repoe-ai-data:
